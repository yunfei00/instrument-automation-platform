name: Instrument Driver Regression

on:
  push:
    paths:
      - "packages/instrument_core/**"
      - "packages/instrument_scpi/**"
      - "packages/instrument_drivers/**"
      - "instrument_profiles/keysight/dsox3000/**"
      - "instrument_profiles/rohde_schwarz/fsw/**"
      - "tests/unit/test_dsox3000_*.py"
      - "tests/unit/test_fsw_*.py"
      - "tools/verify_dsox3034a_snapshot_all.py"
      - ".github/workflows/instrument-driver-regression.yml"
  pull_request:
    paths:
      - "packages/instrument_core/**"
      - "packages/instrument_scpi/**"
      - "packages/instrument_drivers/**"
      - "instrument_profiles/keysight/dsox3000/**"
      - "instrument_profiles/rohde_schwarz/fsw/**"
      - "tests/unit/test_dsox3000_*.py"
      - "tests/unit/test_fsw_*.py"
      - "tools/verify_dsox3034a_snapshot_all.py"
      - ".github/workflows/instrument-driver-regression.yml"
  workflow_dispatch:

jobs:
  driver-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile reusable driver modules
        run: |
          python -m py_compile packages/instrument_drivers/src/instrument_drivers/keysight/dsox3000/driver.py
          python -m py_compile packages/instrument_drivers/src/instrument_drivers/keysight/dsox3000/single_capture.py
          python -m py_compile packages/instrument_drivers/src/instrument_drivers/keysight/dsox3000/snapshot.py
          python -m py_compile packages/instrument_drivers/src/instrument_drivers/rohde_schwarz/fsw/driver.py
          python -m py_compile tools/verify_dsox3034a_snapshot_all.py

      - name: Run DSO-X regression
        run: |
          python -m pytest -q \
            tests/unit/test_dsox3000_driver.py \
            tests/unit/test_dsox3000_single_capture.py \
            tests/unit/test_dsox3000_waveform.py \
            tests/unit/test_dsox3000_trigger_sweep.py \
            tests/unit/test_dsox3000_snapshot.py

      - name: Run FSW regression
        run: |
          python -m pytest -q \
            tests/unit/test_fsw_driver.py \
            tests/unit/test_fsw_input.py \
            tests/unit/test_fsw_arm_read.py \
            tests/unit/test_fsw_bounded_wait.py \
            tests/unit/test_fsw_trace.py
