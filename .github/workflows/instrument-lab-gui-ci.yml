name: Instrument Lab GUI CI

on:
  push:
    paths:
      - "packages/instrument_lab/**"
      - "packages/instrument_core/src/instrument_core/transport/visa.py"
      - "instrument_profiles/**"
      - "tests/unit/test_instrument_lab_gui_backend.py"
      - "tools/instrument_lab_gui.py"
      - "requirements-gui.txt"
      - ".github/workflows/instrument-lab-gui-ci.yml"
  pull_request:
    paths:
      - "packages/instrument_lab/**"
      - "packages/instrument_core/src/instrument_core/transport/visa.py"
      - "instrument_profiles/**"
      - "tests/unit/test_instrument_lab_gui_backend.py"
      - "tools/instrument_lab_gui.py"
      - "requirements-gui.txt"
      - ".github/workflows/instrument-lab-gui-ci.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile GUI modules
        run: |
          python -m py_compile packages/instrument_core/src/instrument_core/transport/visa.py
          python -m py_compile packages/instrument_lab/src/instrument_lab/gui_backend.py
          python -m py_compile packages/instrument_lab/src/instrument_lab/gui.py
          python -m py_compile packages/instrument_lab/src/instrument_lab/gui_io.py
          python -m py_compile packages/instrument_lab/src/instrument_lab/gui_stable.py
          python -m py_compile tools/instrument_lab_gui.py

      - name: Run GUI backend tests
        run: python -m pytest -q tests/unit/test_instrument_lab_gui_backend.py
