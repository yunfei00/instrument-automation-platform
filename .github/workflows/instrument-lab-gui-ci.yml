name: Instrument Lab GUI CI

on:
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packages/instrument_lab/**"
      - "packages/instrument_drivers/src/instrument_drivers/rohde_schwarz/fsw/**"
      - "packages/instrument_core/src/instrument_core/transport/visa.py"
      - "packages/instrument_core/src/instrument_core/bridge/**"
      - "instrument_profiles/**"
      - "tests/unit/test_instrument_lab_gui_backend.py"
      - "tests/unit/test_instrument_operations.py"
      - "tests/unit/test_instrument_panels.py"
      - "tests/unit/test_instrument_lab_units.py"
      - "tests/unit/test_dsox_waveform_operation.py"
      - "tests/unit/test_dsox_control_operations.py"
      - "tests/unit/test_dsox_gui_control_registration.py"
      - "tests/unit/test_dsox_control_panel_composition.py"
      - "tests/unit/test_fsw_operations.py"
      - "tests/unit/test_fsw_reference_trigger_operations.py"
      - "tests/unit/test_fsw_screenshot_operation.py"
      - "tests/unit/test_fsw_control_panel_layout.py"
      - "tests/unit/test_fsw_composed_panel.py"
      - "tests/unit/test_instrument_control_workspace.py"
      - "tests/unit/test_bridge_protocol.py"
      - "tests/unit/test_instrument_port_bridge_launcher.py"
      - "tools/instrument_lab_gui.py"
      - "tools/instrument_port_bridge.py"
      - "requirements-gui.txt"
      - ".github/workflows/instrument-lab-gui-ci.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "packages/instrument_lab/**"
      - "packages/instrument_drivers/src/instrument_drivers/rohde_schwarz/fsw/**"
      - "packages/instrument_core/src/instrument_core/transport/visa.py"
      - "packages/instrument_core/src/instrument_core/bridge/**"
      - "instrument_profiles/**"
      - "tests/unit/test_instrument_lab_gui_backend.py"
      - "tests/unit/test_instrument_operations.py"
      - "tests/unit/test_instrument_panels.py"
      - "tests/unit/test_instrument_lab_units.py"
      - "tests/unit/test_dsox_waveform_operation.py"
      - "tests/unit/test_dsox_control_operations.py"
      - "tests/unit/test_dsox_gui_control_registration.py"
      - "tests/unit/test_dsox_control_panel_composition.py"
      - "tests/unit/test_fsw_operations.py"
      - "tests/unit/test_fsw_reference_trigger_operations.py"
      - "tests/unit/test_fsw_screenshot_operation.py"
      - "tests/unit/test_fsw_control_panel_layout.py"
      - "tests/unit/test_fsw_composed_panel.py"
      - "tests/unit/test_instrument_control_workspace.py"
      - "tests/unit/test_bridge_protocol.py"
      - "tests/unit/test_instrument_port_bridge_launcher.py"
      - "tools/instrument_lab_gui.py"
      - "tools/instrument_port_bridge.py"
      - "requirements-gui.txt"
      - ".github/workflows/instrument-lab-gui-ci.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync development environment
        run: uv sync --group dev

      - name: Compile GUI and bridge modules
        run: |
          uv run python -m py_compile packages/instrument_core/src/instrument_core/transport/visa.py
          uv run python -m py_compile packages/instrument_core/src/instrument_core/bridge/__init__.py
          uv run python -m py_compile packages/instrument_core/src/instrument_core/bridge/models.py
          uv run python -m py_compile packages/instrument_core/src/instrument_core/bridge/protocol.py
          uv run python -m py_compile packages/instrument_core/src/instrument_core/bridge/tcp_bridge.py
          uv run python -m py_compile packages/instrument_core/src/instrument_core/bridge/visa_bridge.py
          uv run python -m py_compile packages/instrument_core/src/instrument_core/bridge/discovery.py
          uv run python -m py_compile packages/instrument_drivers/src/instrument_drivers/rohde_schwarz/fsw/controls.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_backend.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/operations.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/units.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_units.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/dsox_waveform_operation.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/dsox_control_operations.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/fsw_operations.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/fsw_reference_trigger_operations.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/fsw_screenshot_operation.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/panels.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_io.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_stable.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_panels.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_dsox_controls.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_fsw.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_fsw_reference_trigger.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_fsw_screenshot.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_fsw_composed.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/gui_control.py
          uv run python -m py_compile packages/instrument_lab/src/instrument_lab/port_bridge_gui.py
          uv run python -m py_compile tools/instrument_lab_gui.py
          uv run python -m py_compile tools/instrument_port_bridge.py

      - name: Run GUI and bridge backend tests
        run: |
          uv run pytest -q tests/unit/test_instrument_lab_gui_backend.py
          uv run pytest -q tests/unit/test_instrument_operations.py
          uv run pytest -q tests/unit/test_instrument_panels.py
          uv run pytest -q tests/unit/test_instrument_lab_units.py
          uv run pytest -q tests/unit/test_dsox_waveform_operation.py
          uv run pytest -q tests/unit/test_dsox_control_operations.py
          uv run pytest -q tests/unit/test_dsox_gui_control_registration.py
          uv run pytest -q tests/unit/test_dsox_control_panel_composition.py
          uv run pytest -q tests/unit/test_fsw_operations.py
          uv run pytest -q tests/unit/test_fsw_reference_trigger_operations.py
          uv run pytest -q tests/unit/test_fsw_screenshot_operation.py
          uv run pytest -q tests/unit/test_fsw_control_panel_layout.py
          uv run pytest -q tests/unit/test_fsw_composed_panel.py
          uv run pytest -q tests/unit/test_instrument_control_workspace.py
          uv run pytest -q tests/unit/test_bridge_protocol.py
          uv run pytest -q tests/unit/test_instrument_port_bridge_launcher.py
